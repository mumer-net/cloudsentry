[project]
name = "cloudsentry"
version = "0.3.0"
description = "Audits AWS VPC network security against seven CIS AWS Foundations controls"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "boto3[crt]>=1.43",
    "fastapi>=0.142",
    "psycopg[binary]>=3.3",
    "rich>=15",
    "uvicorn>=0.54",
]

[project.scripts]
cloudsentry = "cloudsentry.cli:main"

[dependency-groups]
dev = [
    "pytest>=9",
    "ruff>=0.16",
    "moto[ec2]>=5.2",
    "httpx2>=2.13",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
