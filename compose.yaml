services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: cloudsentry
      POSTGRES_DB: cloudsentry
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - history:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudsentry"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build: .
    environment:
      CLOUDSENTRY_DB: postgresql://cloudsentry:${POSTGRES_PASSWORD}@db:5432/cloudsentry
    ports:
      - "127.0.0.1:8000:8000"
    # Without this, --wait counts the API as ready before uvicorn is listening.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 15
    depends_on:
      db:
        condition: service_healthy

volumes:
  history:
